<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小米卡片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ccc;
    }

    .card {
      width: 234px;
      height: 300px;
      background-color: #fff;
      margin: 100px auto;
      text-align: center;
      transition: all .3s;
    }

    .card img {
      width: 160px;
      height: 160px;
      margin-top: 20px;
    }

    .card .title {
      font-size: 14px;
      font-weight: 400;
      color: #333;
      margin-top: 18px;
    }

    .card .desc {
      font-size: 12px;
      color: #b0b0b0;
      /* 单行文本溢出省略号 */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 15px;
    }

    .card .price {
      font-size: 14px;
      color: #b0b0b0;
      margin-top: 10px;
    }

    .card .price span {
      color: #ff6700;
    }

    .card:hover {
      box-shadow: 0 15px 30px rgba(0, 0, 0, .1);
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="./image1.webp" alt="">
    <h3 class="title">小米14 Buds 6</h3>
    <p class="desc">¥仿生曲线设计|哈曼金耳朵联合调音|耳机独立录音2.0</p>
    <p class="price">
      <span>649元</span>
      <del>699元</del>
    </p>
  </div>

</body>

</html>
